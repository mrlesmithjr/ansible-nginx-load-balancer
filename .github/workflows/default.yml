---
name: Molecule Test
on:
  pull_request:
    branches:
      - develop
      - main
      - master
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        # ubuntu2204 (the fleet-standard target) is not used here: the
        # nginx PPA this role depends on (ppa:nginx/stable) has never
        # published packages for jammy, only up to focal. ubuntu2004 is
        # the newest Ubuntu release the PPA actually supports.
        molecule_distro:
          - ubuntu2004
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Test with molecule
        run: |
          molecule test --scenario-name ${{ matrix.molecule_distro }}
